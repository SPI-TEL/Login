<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso - CONTRATO VIVO - SPI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b1a2d;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      padding: 40px 36px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .shield-icon {
      width: 68px;
      height: 68px;
      background: #0088ff;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      color: #ffffff;
      font-size: 32px;
      box-shadow: 0 8px 18px rgba(0, 136, 255, 0.35);
    }

    .card h1 {
      font-size: 22px;
      font-weight: 800;
      color: #0b1a2d;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .card p.subtitle {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 26px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      color: #94a3b8;
      font-size: 15px;
    }

    .input-wrapper input {
      width: 100%;
      height: 46px;
      padding-left: 42px;
      padding-right: 14px;
      background-color: #eaf1fb;
      border: 1px solid #d3e1f5;
      border-radius: 10px;
      font-size: 14px;
      color: #1e293b;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-wrapper input:focus {
      border-color: #0088ff;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 136, 255, 0.15);
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      background: #0084d6;
      border: none;
      border-radius: 10px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      margin-top: 22px;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background: #006eb5;
    }

    .btn-submit:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .link-primeiro-acesso {
      display: inline-block;
      margin-top: 14px;
      font-size: 13px;
      color: #0084d6;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .link-primeiro-acesso:hover {
      text-decoration: underline;
    }

    .footer-text {
      margin-top: 28px;
      font-size: 11px;
      color: #94a3b8;
      font-weight: 500;
    }

    .msg-feedback {
      margin-top: 14px;
      font-size: 13px;
      min-height: 18px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(11, 26, 45, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      padding: 30px 28px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 18px;
      right: 18px;
      border: none;
      background: transparent;
      font-size: 20px;
      color: #94a3b8;
      cursor: pointer;
    }

    .modal-close:hover {
      color: #1e293b;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="shield-icon">
      <i class="fa-solid fa-shield-halved"></i>
    </div>
    <h1>CONTRATO VIVO - SPI</h1>
    <p class="subtitle">Painel Gerencial de Desempenho Operacional</p>

    <div class="input-group">
      <label for="login-usuario">Usuário / IDTEL</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-user"></i>
        <input type="text" id="login-usuario" placeholder="Insira seu IDTEL ou Usuário">
      </div>
    </div>

    <div class="input-group">
      <label for="login-senha">Senha</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="login-senha" placeholder="••••••••">
      </div>
    </div>

    <button id="btn-login" class="btn-submit" onclick="fazerLogin()">
      <span>Entrar no Portal</span>
      <i class="fa-solid fa-arrow-right"></i>
    </button>

    <div>
      <a class="link-primeiro-acesso" onclick="abrirModalPrimeiroAcesso()">1º Acesso / Cadastrar ou Alterar Senha</a>
    </div>

    <div id="mensagem" class="msg-feedback"></div>

    <div class="footer-text">
      Acesso restrito à supervisão e coordenação SPI
    </div>
  </div>

  <!-- Modal Primeiro Acesso -->
  <div id="modalAcesso" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" onclick="fecharModal()"><i class="fa-solid fa-xmark"></i></button>
      <h2 style="font-size: 19px; color: #0b1a2d; margin-bottom: 8px;">Primeiro Acesso / Troca de Senha</h2>
      <p style="font-size: 12px; color: #64748b; margin-bottom: 20px;">Informe seu IDTEL cadastrado para prosseguir.</p>

      <div class="input-group">
        <label for="modal-idtel">IDTEL</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-id-badge"></i>
          <input type="text" id="modal-idtel" placeholder="Ex: 12345">
        </div>
      </div>

      <div class="input-group">
        <label for="modal-nome">Nome de Usuário</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="modal-nome" placeholder="Seu nome completo">
        </div>
      </div>

      <div id="grupo-senha-anterior" class="input-group" style="display: none;">
        <label for="modal-senha-antiga">Senha Atual (Coluna E)</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-key"></i>
          <input type="password" id="modal-senha-antiga" placeholder="Confirme a senha anterior">
        </div>
      </div>

      <div class="input-group">
        <label id="lbl-nova-senha" for="modal-senha">Nova Senha</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="modal-senha" placeholder="Digite sua senha">
        </div>
      </div>

      <button id="btn-cadastrar" class="btn-submit" onclick="processarCadastro()">Salvar Dados</button>
      <div id="modal-mensagem" class="msg-feedback" style="text-align: center;"></div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/a/macros/teltelecom.com.br/s/AKfycbxlwoAP2Wl7UjqFZOmegwt_ojrouZCCqdHaCPdHuPz92Sbw3j--uzT2K4DOrYbvdceyQg/exec";

    function abrirModalPrimeiroAcesso() {
      document.getElementById("modalAcesso").classList.add("active");
      document.getElementById("modal-mensagem").innerText = "";
    }

    function fecharModal() {
      document.getElementById("modalAcesso").classList.remove("active");
    }

    async function fazerLogin() {
      const usuario = document.getElementById("login-usuario").value.trim();
      const senha = document.getElementById("login-senha").value.trim();
      const msgDiv = document.getElementById("mensagem");
      const btn = document.getElementById("btn-login");

      if (!usuario || !senha) {
        msgDiv.style.color = "#dc2626";
        msgDiv.innerText = "Preencha usuário e senha!";
        return;
      }

      btn.disabled = true;
      msgDiv.style.color = "#0084d6";
      msgDiv.innerText = "Autenticando...";

      try {
        const url = `${SCRIPT_URL}?action=login&usuario=${encodeURIComponent(usuario)}&senha=${encodeURIComponent(senha)}`;
        const response = await fetch(url, { method: "GET", redirect: "follow" });
        const res = await response.json();

        if (res.status === "sucesso") {
          // Gravação dos dados no localStorage
          localStorage.setItem("usuario_logado", res.nome);
          localStorage.setItem("perfil_usuario", res.perfil);
          localStorage.setItem("ultimo_acesso", res.ultimoAcesso || "Primeiro acesso");

          window.location.href = "https://spi-tel.github.io/Painel/";
        } else {
          msgDiv.style.color = "#dc2626";
          msgDiv.innerText = res.mensagem;
        }
      } catch (err) {
        msgDiv.style.color = "#dc2626";
        msgDiv.innerText = "Erro ao conectar ao servidor de validação.";
      } finally {
        btn.disabled = false;
      }
    }

    async function processarCadastro() {
      const idtel = document.getElementById("modal-idtel").value.trim();
      const nome = document.getElementById("modal-nome").value.trim();
      const senha = document.getElementById("modal-senha").value.trim();
      const senhaAntiga = document.getElementById("modal-senha-antiga").value.trim();
      const msgModal = document.getElementById("modal-mensagem");
      const grupoAnterior = document.getElementById("grupo-senha-anterior");

      if (!idtel || !nome || !senha) {
        msgModal.style.color = "#dc2626";
        msgModal.innerText = "Preencha todos os campos obrigatórios!";
        return;
      }

      msgModal.style.color = "#0084d6";
      msgModal.innerText = "Processando solicitação...";

      try {
        const url = `${SCRIPT_URL}?action=salvarAcesso&idtel=${encodeURIComponent(idtel)}&nome=${encodeURIComponent(nome)}&senha=${encodeURIComponent(senha)}&senhaAntiga=${encodeURIComponent(senhaAntiga)}`;
        const response = await fetch(url, { method: "GET", redirect: "follow" });
        const res = await response.json();

        if (res.status === "sucesso") {
          msgModal.style.color = "#16a34a";
          msgModal.innerText = res.mensagem;
          setTimeout(() => {
            fecharModal();
          }, 2000);
        } else if (res.status === "exige_anterior") {
          grupoAnterior.style.display = "block";
          document.getElementById("lbl-nova-senha").innerText = "Nova Senha (Coluna F)";
          msgModal.style.color = "#ea580c";
          msgModal.innerText = res.mensagem;
        } else {
          msgModal.style.color = "#dc2626";
          msgModal.innerText = res.mensagem;
        }
      } catch (err) {
        msgModal.style.color = "#dc2626";
        msgModal.innerText = "Erro ao processar cadastro.";
      }
    }
  </script>
</body>
</html>
